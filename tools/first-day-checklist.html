<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Day Checklist — CBFX Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #dde4ed;
      --surface: #eaeff5;
      --surface2: #d5dce7;
      --nav: #1a1c22;
      --border: #c0c8d4;
      --border-dark: #a8b2bf;
      --text: #1a1c22;
      --text2: #3d4452;
      --muted: #6b7585;
      --white: #f4f7fa;
      --blue-dark: #1e3a5a;
      --green: #3ecf6e;
      --green-light: #e8faf0;
      --green-mid: #c5f0d8;
      --print-hidden: block;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Figtree', sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--nav);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.08em;
      text-decoration: none;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .topbar-title {
      font-size: 13px;
      font-weight: 500;
      color: rgba(244,247,250,0.55);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .topbar-back {
      font-size: 13px;
      font-weight: 500;
      color: rgba(244,247,250,0.7);
      text-decoration: none;
      transition: color 0.15s;
    }
    .topbar-back:hover { color: var(--white); }

    /* ── LAYOUT ── */
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }

    /* ── HERO ── */
    .hero {
      margin-bottom: 28px;
    }
    .hero h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--blue-dark);
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .hero p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── PROGRESS BAR ── */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .progress-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .progress-count {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .progress-track {
      height: 8px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 99px;
      transition: width 0.35s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }
    .progress-actions {
      display: flex;
      gap: 10px;
      margin-left: auto;
    }
    .btn {
      font-family: 'Figtree', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid var(--border-dark);
      background: var(--surface);
      color: var(--text2);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover { background: var(--surface2); border-color: var(--border-dark); color: var(--text); }
    .btn-primary {
      background: var(--blue-dark);
      color: var(--white);
      border-color: var(--blue-dark);
    }
    .btn-primary:hover { background: #16304d; border-color: #16304d; color: var(--white); }

    /* ── COMPLETION BANNER ── */
    .completion-banner {
      display: none;
      background: linear-gradient(135deg, #e8faf0 0%, #d0f5e3 100%);
      border: 1.5px solid var(--green);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 28px;
      align-items: center;
      gap: 16px;
    }
    .completion-banner.visible { display: flex; }
    .completion-icon {
      font-size: 32px;
      flex-shrink: 0;
    }
    .completion-text h2 {
      font-size: 17px;
      font-weight: 700;
      color: #1a5c35;
      margin-bottom: 3px;
    }
    .completion-text p {
      font-size: 13px;
      color: #2d7a4f;
    }

    /* ── SECTION ── */
    .section {
      margin-bottom: 20px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 0 2px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .section-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 1px 8px;
    }
    .section-badge.done {
      background: var(--green-mid);
      border-color: #a3e8c1;
      color: #1a5c35;
    }

    /* ── CHECKLIST CARD ── */
    .checklist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── ITEM ── */
    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border);
      user-select: none;
      -webkit-user-select: none;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: var(--surface2); }
    .item.checked {
      background: var(--green-light);
    }
    .item.checked:hover { background: #daf5e9; }

    .checkbox {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 6px;
      border: 1.5px solid var(--border-dark);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .item.checked .checkbox {
      background: var(--green);
      border-color: var(--green);
    }
    .checkmark {
      display: none;
    }
    .item.checked .checkmark {
      display: block;
    }
    /* SVG checkmark */
    .checkmark svg {
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }
    .item-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      transition: color 0.15s;
    }
    .item.checked .item-label {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-color: #a3e8c1;
    }
    .item-link {
      display: inline-block;
      margin-top: 3px;
      font-size: 12px;
      font-weight: 500;
      color: #2a6fa8;
      text-decoration: none;
    }
    .item-link:hover { text-decoration: underline; }
    .item-link svg {
      display: inline;
      vertical-align: middle;
      margin-left: 2px;
      width: 10px;
      height: 10px;
    }

    /* ── CONFETTI CANVAS ── */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* ── PRINT ── */
    @media print {
      .topbar-back, .progress-actions, #confetti-canvas, .completion-banner { display: none !important; }
      .topbar { position: static; background: #1a1c22 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .item { break-inside: avoid; }
      .item.checked { background: #e8faf0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .item.checked .checkbox { background: #3ecf6e !important; border-color: #3ecf6e !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { background: white; }
      .page { padding: 20px; }
    }
  </style>
<link rel="stylesheet" href="../assets/interactions.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- TOPBAR -->
<nav class="topbar">
  <a class="topbar-brand" href="../index.html">CBFX Hub</a>
  <div class="topbar-right">
    <span class="topbar-title">First Day Checklist</span>
    <a class="topbar-back" href="../index.html">← Back to Hub</a>
  </div>
</nav>

<!-- PAGE -->
<div class="page">

  <!-- HERO -->
  <div class="hero">
    <h1>First Day Checklist</h1>
    <p>Complete these steps to get fully set up on your first day.</p>
  </div>

  <!-- PROGRESS -->
  <div class="progress-card">
    <div class="progress-header">
      <span class="progress-label">Progress</span>
      <span class="progress-count" id="progress-count">0 of 18 complete</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
      <button class="btn" id="reset-btn">Reset</button>
      <button class="btn btn-primary" onclick="window.print()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print
      </button>
    </div>
  </div>

  <!-- COMPLETION BANNER -->
  <div class="completion-banner" id="completion-banner">
    <div class="completion-icon">🎉</div>
    <div class="completion-text">
      <h2>You're all set!</h2>
      <p>Every item is checked off. Welcome to the CBFX team — you're ready to go.</p>
    </div>
  </div>

  <!-- SECTIONS -->
  <div id="checklist-root"></div>

</div>

<script>
  const STORAGE_KEY = 'cbfx-first-day-checklist-v1';

  const sections = [
    {
      id: 'account-access',
      title: 'Account Access',
      items: [
        { id: 'aa1', label: 'Log in to VDI at vdi.cbfx.com (credentials from IT/GPL Tech)' },
        { id: 'aa2', label: 'Confirm ShotGrid login at cbfx.shotgunstudio.com' },
        { id: 'aa3', label: 'Verify email access (check with supervisor for domain)' },
        { id: 'aa4', label: 'Test WireGuard VPN connection' },
      ]
    },
    {
      id: 'workstation-setup',
      title: 'Workstation Setup',
      items: [
        { id: 'ws1', label: 'Confirm EC2 instance is running (check with supervisor)' },
        { id: 'ws2', label: 'Launch Nuke — verify license checkout from RLM (10.243.0.139:5053)' },
        { id: 'ws3', label: 'Verify NAS mount at \\\\192.168.100.187\\SYSXS (mapped Y:)' },
        { id: 'ws4', label: 'Check Deadline Cloud worker is registered and active' },
      ]
    },
    {
      id: 'pipeline-orientation',
      title: 'Pipeline Orientation',
      items: [
        { id: 'po1', label: 'Review CBFX Naming Conventions', link: { href: '../docs/naming-conventions.html', text: 'Open Naming Conventions' } },
        { id: 'po2', label: 'Review Color Pipeline Reference / ACES 1.3 config', link: { href: '../docs/color-pipeline.html', text: 'Open Color Pipeline Reference' } },
        { id: 'po3', label: 'Confirm OCIO environment variable is set correctly' },
        { id: 'po4', label: 'Open a test shot in Nuke from ShotGrid' },
      ]
    },
    {
      id: 'production-checkin',
      title: 'Production Check-in',
      items: [
        { id: 'pc1', label: 'Introduction call with your supervisor' },
        { id: 'pc2', label: 'Review your assigned show in ShotGrid' },
        { id: 'pc3', label: 'Confirm your booking dates and rate with production' },
        { id: 'pc4', label: 'Understand the daily/weekly dailies schedule' },
      ]
    },
    {
      id: 'wrap',
      title: 'Wrap',
      items: [
        { id: 'wr1', label: 'Introduce yourself in the team chat' },
        { id: 'wr2', label: 'Confirm you can submit a Deadline render job (test render OK)' },
        { id: 'wr3', label: 'Ask your supervisor any outstanding questions' },
      ]
    },
  ];

  const totalItems = sections.reduce((n, s) => n + s.items.length, 0);

  // Load state
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();

  function getCheckedCount() {
    return Object.values(state).filter(Boolean).length;
  }

  // Build DOM
  function buildChecklist() {
    const root = document.getElementById('checklist-root');
    root.innerHTML = '';

    sections.forEach(section => {
      const sectionEl = document.createElement('div');
      sectionEl.className = 'section';
      sectionEl.dataset.sectionId = section.id;

      const header = document.createElement('div');
      header.className = 'section-header';

      const titleEl = document.createElement('span');
      titleEl.className = 'section-title';
      titleEl.textContent = section.title;

      const badge = document.createElement('span');
      badge.className = 'section-badge';
      badge.dataset.sectionBadge = section.id;

      header.appendChild(titleEl);
      header.appendChild(badge);
      sectionEl.appendChild(header);

      const card = document.createElement('div');
      card.className = 'checklist-card';

      section.items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item' + (state[item.id] ? ' checked' : '');
        row.dataset.itemId = item.id;

        row.innerHTML = `
          <div class="checkbox">
            <span class="checkmark">
              <svg viewBox="0 0 12 10"><polyline points="1.5,5.5 4.5,8.5 10.5,1.5" /></svg>
            </span>
          </div>
          <div class="item-content">
            <div class="item-label">${escapeHtml(item.label)}</div>
            ${item.link ? `<a class="item-link" href="${escapeHtml(item.link.href)}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(item.link.text)}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>` : ''}
          </div>
        `;

        row.addEventListener('click', () => toggleItem(item.id));
        card.appendChild(row);
      });

      sectionEl.appendChild(card);
      root.appendChild(sectionEl);
    });

    updateProgress();
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleItem(id) {
    state[id] = !state[id];
    saveState(state);

    const row = document.querySelector(`.item[data-item-id="${id}"]`);
    if (row) row.classList.toggle('checked', state[id]);

    updateProgress();
    updateSectionBadge(id);
  }

  function updateSectionBadge(itemId) {
    // Find which section this item belongs to
    for (const section of sections) {
      if (section.items.some(i => i.id === itemId)) {
        refreshSectionBadge(section);
        break;
      }
    }
  }

  function refreshSectionBadge(section) {
    const checked = section.items.filter(i => state[i.id]).length;
    const total = section.items.length;
    const badge = document.querySelector(`[data-section-badge="${section.id}"]`);
    if (!badge) return;
    badge.textContent = `${checked}/${total}`;
    badge.classList.toggle('done', checked === total);
  }

  function updateProgress() {
    const checked = getCheckedCount();
    const pct = totalItems > 0 ? (checked / totalItems) * 100 : 0;

    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-count').textContent = `${checked} of ${totalItems} complete`;

    // Refresh all section badges
    sections.forEach(s => refreshSectionBadge(s));

    // Completion
    const banner = document.getElementById('completion-banner');
    if (checked === totalItems) {
      if (!banner.classList.contains('visible')) {
        banner.classList.add('visible');
        launchConfetti();
      }
    } else {
      banner.classList.remove('visible');
    }
  }

  // Reset
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('Reset all checkboxes?')) return;
    state = {};
    saveState(state);
    document.querySelectorAll('.item.checked').forEach(el => el.classList.remove('checked'));
    document.getElementById('completion-banner').classList.remove('visible');
    updateProgress();
  });

  // ── CONFETTI ──
  function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#3ecf6e','#1e3a5a','#f4c430','#e8faf0','#2a6fa8','#ffffff','#a3e8c1'];
    const pieces = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -200 - 10,
      w: Math.random() * 8 + 5,
      h: Math.random() * 5 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.15,
      vx: (Math.random() - 0.5) * 2.5,
      vy: Math.random() * 3 + 2,
      opacity: 1,
    }));

    let frame;
    let elapsed = 0;
    const duration = 3500;

    function draw(ts) {
      if (!draw.start) draw.start = ts;
      elapsed = ts - draw.start;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let alive = 0;
      pieces.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        if (elapsed > duration * 0.6) {
          p.opacity = Math.max(0, p.opacity - 0.018);
        }
        if (p.y < canvas.height + 20 && p.opacity > 0) alive++;

        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });

      if (alive > 0 && elapsed < duration + 1000) {
        frame = requestAnimationFrame(draw);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    cancelAnimationFrame(frame);
    requestAnimationFrame(draw);
  }

  // Init
  buildChecklist();
</script>
<script src="../assets/dev-mock-fill.js"></script>
<script src="../assets/date-clamp.js"></script>
</body>
</html>
